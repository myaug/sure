        openai_request_timeout_label: "Thời gian chờ yêu cầu, tính bằng giây (không bắt buộc)"
        openai_request_timeout_help: "Mặc định: 60. Áp dụng cho mỗi yêu cầu HTTP tương thích OpenAI, gồm tự động phân loại, phát hiện đơn vị bán hàng, trò chuyện, xử lý PDF và các lời gọi vector store. OPENAI_REQUEST_TIMEOUT ghi đè trường này."
        ai_response_timeout_label: "Thời gian chờ phản hồi, tính bằng giây (không bắt buộc)"
        ai_response_timeout_help: "Mặc định: 90. Chỉ áp dụng cho bộ giám sát toàn lượt của trò chuyện, nên hãy tính như một tổng: (1 + ASSISTANT_MAX_TOOL_CALL_ITERATIONS) × thời gian chờ yêu cầu, cộng thời gian chạy công cụ và hàng đợi. AI_RESPONSE_TIMEOUT ghi đè trường này."
        ai_health_probe_timeout_label: "Thời gian chờ kiểm tra tình trạng, tính bằng giây (không bắt buộc)"
        ai_health_probe_timeout_help: "Mặc định: 5. Chỉ áp dụng cho các kiểm tra AI trực tiếp trong Cài đặt → Tình trạng hệ thống, không bao giờ áp dụng cho lời gọi AI thật. Hãy tăng nếu kiểm tra PDF báo hết thời gian với mô hình đám mây. AI_HEALTH_PROBE_TIMEOUT ghi đè trường này."
