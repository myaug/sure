          alerts:
            custom_openai:
              title: "Kiểm tra vector store được lưu trữ thất bại tại endpoint tùy chỉnh này"
              message: "Endpoint đã cấu hình không qua được kiểm tra sống /v1/vector_stores. Hầu hết endpoint cục bộ và tương thích OpenAI không triển khai API đó. Trò chuyện và xử lý PDF vẫn có thể hoạt động; hãy dùng pgvector với endpoint embedding riêng cho thiết lập cục bộ thông thường. Lỗi đã được ghi lại trong Cài đặt → Nhật ký gỡ lỗi và Rails.logger."
            function_calling_unsupported:
              title: "Mô hình không hỗ trợ gọi hàm"
              message: "Endpoint phục vụ yêu cầu trò chuyện thông thường nhưng từ chối chính yêu cầu đó khi kèm tham số tools. Trợ lý AI đọc tài khoản, giao dịch và holding qua lời gọi hàm, nên trò chuyện sẽ tiếp tục lỗi — thường với lỗi 404 khó hiểu — cho đến khi dùng mô hình hỗ trợ tools. Hãy chọn mô hình mà nhà cung cấp ghi rõ hỗ trợ gọi hàm. Lỗi đã được ghi lại trong Cài đặt → Nhật ký gỡ lỗi và Rails.logger."
            function_calling_not_used:
              title: "Mô hình trả lời mà không gọi công cụ được yêu cầu gọi"
              message: "Endpoint chấp nhận tham số tools, nhưng mô hình trả lời bằng văn bản thay vì gọi công cụ kiểm tra tình trạng. Trợ lý AI không thể đọc dữ liệu tài chính nếu không gọi công cụ, nên trò chuyện có thể trả lời trống hoặc bằng số liệu bịa. Hãy ưu tiên mô hình mà nhà cung cấp ghi rõ hỗ trợ gọi hàm."
            llm_probe_failed:
              title: "Kiểm tra trực tiếp LLM thất bại"
              message: "Sure không thể xác minh cả endpoint lẫn mô hình đã cấu hình. Lỗi đã được ghi lại trong Cài đặt → Nhật ký gỡ lỗi và Rails.logger."
            llm_model_not_available:
              title: "Mô hình AI đã cấu hình không khả dụng"
              message: "Endpoint có trả lời, nhưng không liệt kê hoặc phục vụ mô hình đã cấu hình. Hãy chọn mô hình đang hoạt động cho nhà cung cấp đã chọn, rồi chạy lại kiểm tra. Với Gemini qua lớp chuyển đổi tương thích OpenAI, hãy dùng mô hình được hỗ trợ hiện tại như gemini-3.8-flash."
            pdf_text_extraction_failed:
              title: "Kiểm tra trích xuất văn bản PDF giả lập thất bại"
              message: "Sure không thể hoàn tất đường dẫn ưu tiên văn bản, vốn trích xuất văn bản PDF nhúng cục bộ và gửi cho mô hình đã cấu hình. Không có dữ liệu khách hàng nào được gửi. Lỗi đã được ghi lại trong Cài đặt → Nhật ký gỡ lỗi và Rails.logger."
            pdf_vision_processing_failed:
              title: "Kiểm tra PDF vision/gốc giả lập thất bại"
              message: "Sure không thể hoàn tất đường dẫn PDF dạng ảnh hoặc tài liệu gốc qua mô hình đã cấu hình. Không có dữ liệu khách hàng nào được gửi. Lỗi đã được ghi lại trong Cài đặt → Nhật ký gỡ lỗi và Rails.logger."
            vector_probe_failed:
              title: "Kiểm tra trực tiếp tìm kiếm tài liệu thất bại"
              message: "Sure không thể xác minh vector store đã chọn và mọi dịch vụ embedding cần thiết. Lỗi đã được ghi lại trong Cài đặt → Nhật ký gỡ lỗi và Rails.logger."
            pgvector_extension_not_enabled:
              title: "Tiện ích mở rộng vector của PostgreSQL chưa được bật"
              message: "Đã chọn bộ điều hợp pgvector, nhưng PostgreSQL chưa bật tiện ích mở rộng vector cho cơ sở dữ liệu này. Hãy dùng ảnh PostgreSQL có pgvector, rồi bật tiện ích mở rộng bằng quyền chủ sở hữu cơ sở dữ liệu hoặc siêu người dùng và chạy lại migration với VECTOR_STORE_PROVIDER=pgvector."
            pgvector_table_not_found:
              title: "Thiếu bảng vector_store_chunks"
              message: "Tiện ích mở rộng pgvector đã bật, nhưng không tìm thấy bảng chunks. Hãy kiểm tra trạng thái migration, rồi chạy lại migration vector store với VECTOR_STORE_PROVIDER=pgvector để Sure tạo vector_store_chunks."
            pgvector_probe_failed:
              title: "Kiểm tra lưu trữ pgvector thất bại"
              message: "Sure không thể truy vấn bảng chunks của pgvector. Hãy kiểm tra quyền PostgreSQL, tiện ích mở rộng vector và migration vector_store_chunks. Lỗi đã được ghi lại trong Cài đặt → Nhật ký gỡ lỗi và Rails.logger."
            embedding_dimensions_mismatch:
              title: "Số chiều embedding không khớp"
              message: "Endpoint embedding trả về vector có độ dài không khớp với EMBEDDING_DIMENSIONS. Hãy đặt EMBEDDING_MODEL và EMBEDDING_DIMENSIONS theo kích thước vector được ghi tài liệu của mô hình, khởi động lại Sure để môi trường được giữ, rồi sửa hoặc tạo lại cột/bảng embedding của pgvector và embedding lại tài liệu nếu dữ liệu hiện có dùng kích thước khác."
            embedding_probe_timeout:
              title: "Kiểm tra trực tiếp embedding hết thời gian"
              message: "Endpoint embedding không trả lời trước AI_HEALTH_PROBE_TIMEOUT. Hãy tăng thời gian chờ kiểm tra tình trạng này nếu nhà cung cấp chậm, rồi khởi động lại Sure để môi trường được giữ ở mọi tiến trình. Nếu các lời gọi trò chuyện AI thông thường cũng hết thời gian, hãy tăng OPENAI_REQUEST_TIMEOUT riêng."
            embedding_probe_failed:
              title: "Kiểm tra trực tiếp embedding thất bại"
              message: "Sure không thể tạo embedding thử nghiệm ngắn qua endpoint và mô hình đã cấu hình. Hãy kiểm tra EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN và nhật ký của nhà cung cấp embedding. Lỗi đã được ghi lại trong Cài đặt → Nhật ký gỡ lỗi và Rails.logger."
            qdrant:
              title: "Chưa triển khai hỗ trợ Qdrant"
              message: "Bộ điều hợp Qdrant mới chỉ là khung, các thao tác tải tài liệu lên và tìm kiếm hiện thất bại. Hãy chọn OpenAI hoặc pgvector cho tìm kiếm tài liệu."
            missing_vector_store:
              title: "Chưa cấu hình vector store"
              message: "Tài liệu đã tải lên không thể được lập chỉ mục hay tìm kiếm cho đến khi cấu hình bộ điều hợp vector store và các yêu cầu của nó."
            unavailable_vector_store:
              title: "Vector store đã chọn không khả dụng"
              message: "Hãy kiểm tra các yêu cầu của bộ điều hợp bên dưới. Với pgvector, cơ sở dữ liệu phải có tiện ích mở rộng vector hoặc bảng vector_store_chunks có sẵn."
