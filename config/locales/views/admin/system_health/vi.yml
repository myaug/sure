          worker:
            title: "Xác minh worker"
            description: "Các kiểm tra ở trên chạy từ tiến trình web này. Phần lớn công việc AI -- phản hồi của trợ lý, xử lý PDF, embedding, tự động phân loại và phát hiện đơn vị bán hàng -- thực ra chạy trong tiến trình Sidekiq worker, vốn có thể khác về truy cập mạng, DNS, quy tắc proxy, hoặc thậm chí thông tin xác thực được nạp. Hãy xếp hàng một kiểm tra để xác minh cấu hình và kết nối riêng của worker."
