              process: "Tiến trình worker"
              checked_at: "Đã kiểm tra"
              configuration: "Cấu hình"
            configuration_statuses:
              match: "Khớp với web"
              mismatch: "Khác với web"
            statuses:
              passing: "Đạt"
              failing: "Không đạt"
              stale: "Đã cũ"
            settings_origin:
              title: "Cài đặt nào cần khởi động lại?"
              database_backed: "Các cài đặt nhà cung cấp, mô hình và khóa API được đổi trong Cài đặt → Tự lưu trữ được lưu trong cơ sở dữ liệu. rails-settings-cached vô hiệu hóa bộ nhớ đệm dùng chung khi ghi, nên cả web và worker đều lấy giá trị mới cho yêu cầu hoặc tác vụ xếp hàng kế tiếp -- không cần khởi động lại."
              env_backed: "Cấu hình embedding, và mọi giá trị chỉ được đặt qua biến môi trường, được cố định khi mỗi container khởi động. Rails không thể đổi môi trường của container khác, nên đổi chúng cần khởi động lại hoặc tạo lại cả dịch vụ web và worker -- và công cụ triển khai nào chỉ khởi động lại một trong hai (triển khai từng phần, Secret được cập nhật mà không khởi động lại pod) sẽ không nhận thay đổi."
          local_setup:
            title: "Thiết lập cục bộ được khuyến nghị"
            description: "Chạy LLM qua endpoint tương thích OpenAI cục bộ của bạn, lưu vector tài liệu trong pgvector, và trỏ cài đặt embedding tới một endpoint embedding tương thích OpenAI. Ảnh PostgreSQL phải có tiện ích mở rộng vector, và số chiều embedding phải khớp với mô hình đã chọn."
