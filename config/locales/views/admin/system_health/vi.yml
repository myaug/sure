            title: "Langfuse"
            description: "Báo cáo truy vết và đánh giá AI tùy chọn. Kiểm tra này không gửi dấu vết hay yêu cầu đánh giá nào."
            guidance: "Hãy đặt LANGFUSE_PUBLIC_KEY và LANGFUSE_SECRET_KEY cùng nhau. LANGFUSE_HOST là tùy chọn. Hãy khởi động lại các dịch vụ bị ảnh hưởng sau khi đổi các cài đặt này."
          sentry:
            title: "Sentry"
            description: "Báo cáo lỗi và hiệu năng tùy chọn. Bộ khởi tạo hiện tại chỉ bật báo cáo trong môi trường sản xuất."
            guidance: "Hãy đặt SENTRY_DSN và khởi động lại các dịch vụ bị ảnh hưởng. Việc này kiểm tra cấu hình SDK đã nạp mà không ghi nhận lỗi hay gửi sự kiện nào."
          skylight:
            title: "Skylight"
            description: "Đo đạc hiệu năng ứng dụng tùy chọn. Việc có cấu hình không xác nhận agent đang chạy hay báo cáo."
            guidance: "Hãy đặt SKYLIGHT_AUTHENTICATION và đảm bảo Skylight được nạp trong môi trường Rails dự định. SKYLIGHT_ENABLED=false tắt việc đo đạc; riêng cờ đó không nạp gem. Hãy khởi động lại sau khi đổi."
          stripe:
            title: "Stripe"
            description: "Thanh toán gói đăng ký và webhook thanh toán tùy chọn. Kiểm tra này không tạo máy khách Stripe, xác thực thông tin xác thực hay gửi yêu cầu thanh toán."
            guidance: "Hãy đặt STRIPE_SECRET_KEY và STRIPE_WEBHOOK_SECRET cùng nhau. Thanh toán gói đăng ký được quản lý còn cần STRIPE_MONTHLY_PRICE_ID và STRIPE_ANNUAL_PRICE_ID."
          posthog:
            title: "PostHog"
            description: "Phân tích tùy chọn do người vận hành sở hữu, dùng cấu hình được nạp khi khởi động. Đã cấu hình không có nghĩa là người dùng đã đồng ý với phân tích."
            guidance: "Hãy đặt POSTHOG_KEY và POSTHOG_HOST không để trống, hoặc để trống host để dùng mặc định. Phân tích trên trình duyệt cần môi trường sản xuất hoặc POSTHOG_DEVELOPMENT_ENABLED trong phát triển. POSTHOG_FEEDBACK_ENABLED điều khiển phản hồi tự lưu trữ riêng, không phải phân tích của người vận hành."
          logtail:
            title: "Logtail"
            description: "Chuyển tiếp nhật ký sản xuất tùy chọn. Khi chưa cấu hình, ứng dụng tiếp tục ghi nhật ký ra đầu ra chuẩn."
            guidance: "Hãy đặt LOGTAIL_API_KEY và LOGTAIL_INGESTING_HOST cùng nhau và khởi động lại các dịch vụ bị ảnh hưởng. Kiểm tra này không phát ra nhật ký thử nghiệm nào."
